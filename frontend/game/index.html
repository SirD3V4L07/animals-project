<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="game-styles.css">
    <script src="game.js" defer></script>
    <title>Game</title>
</head>
<body>
    
    <div id="animal-info">
        <div id="animal-picture"></div>
        <div id="animal-stats">
            <span class="stat-wrapper"><span class="stat-title">Name:</span><span class="stat-data" id="stat-name"></span></span>
            <span class="stat-wrapper"><span class="stat-title">Taxonomy:</span><span class="stat-data" id="stat-taxonomy"></span></span>
            <span class="stat-wrapper"><span class="stat-title">Diet:</span><span class="stat-data" id="stat-diet"></span></span>
            <span class="stat-wrapper"><span class="stat-title">Power:</span><span class="stat-data" id="stat-power"></span></span>
            <span class="stat-wrapper"><span class="stat-title">Speed:</span><span class="stat-data" id="stat-speed"></span></span>
        </div>
    </div>
    <div id="gameboard"></div>
    
    
</body>
</html>
